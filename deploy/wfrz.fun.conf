# 宿主机 Nginx 反代（阿里云已备案域名）
# 安装到：/etc/nginx/conf.d/wfrz.fun.conf
# 上游为本项目前端容器，默认映射 127.0.0.1:9000（见 .env.shared 的 WEB_PORT）
#
# 启用：nginx -t && systemctl reload nginx
# HTTPS：将下方 ssl 段的证书路径换成阿里云下载的证书后取消注释。

upstream ai_consultation_frontend {
    server 127.0.0.1:9000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.wfrz.fun wfrz.fun;

    client_max_body_size 50m;

    # 申请证书时可用；正式启用 HTTPS 后建议改为 return 301 https://$host$request_uri;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 微信公众平台「服务器域名」校验文件：放到 /var/www/wechat-verify/MP_verify_xxx.txt
    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wechat-verify;
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ai_consultation_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # AI 问诊 SSE：关闭缓冲
    location = /api/v1/chat/send {
        proxy_pass http://ai_consultation_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wfrz.fun wfrz.fun;

    ssl_certificate     /etc/nginx/ssl/wfrz.fun.pem;
    ssl_certificate_key /etc/nginx/ssl/wfrz.fun.key;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location ~ ^/MP_verify_[A-Za-z0-9]+\.txt$ {
        root /var/www/wechat-verify;
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://ai_consultation_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
    }

    location = /api/v1/chat/send {
        proxy_pass http://ai_consultation_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
    }
}
