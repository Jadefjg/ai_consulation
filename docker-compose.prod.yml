# 阿里云 2C2G 生产覆盖：低内存限制、允许 swap、仅公网暴露前端、国内镜像加速。
# 用法（在 /opt/ai_consulation）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 公网入口默认 9000（80/8000 已被其它服务占用，且 9000 已在 firewalld 放行）。
# 若浏览器超时，请在阿里云 ECS 安全组放行入方向 TCP 9000（本机 firewalld 不够）。
# MySQL / Neo4j / 后端仅绑定 127.0.0.1，不对公网暴露。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  mysql:
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=96M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-mysqlx
    ports: !override
      - "127.0.0.1:3308:3306"
    mem_limit: 256m
    memswap_limit: 512m
    logging: *default-logging

  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 192m
      NEO4J_server_memory_pagecache_size: 48m
    ports: !override
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    mem_limit: 480m
    memswap_limit: 960m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  backend:
    build:
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    environment:
      ANONYMIZED_TELEMETRY: "False"
    ports: !override
      - "127.0.0.1:8001:8000"
    mem_limit: 448m
    memswap_limit: 896m
    logging: *default-logging
    healthcheck:
      start_period: 420s
      retries: 30

  frontend:
    build:
      args:
        NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        NODE_OPTIONS: --max-old-space-size=384
    ports: !override
      - "${WEB_PORT:-9000}:80"
    mem_limit: 64m
    memswap_limit: 128m
    logging: *default-logging
