# AI 智能医疗问诊平台 — 统一编排（本地 / 阿里云单机 / 阿里云共享 MySQL）
#
# 本地开发（默认 .env）：
#   docker compose up -d --build
#
# 阿里云单机（自带 MySQL + Neo4j）：
#   docker compose --env-file .env.prod up -d --build
#
# 阿里云共享 MySQL（接入 shared-infra 网络中的 shared-mysql）：
#   docker compose --env-file .env.shared up -d --build
#
# 通过 COMPOSE_PROFILES 控制是否启动中间件：
#   with-mysql  — 内置 MySQL（共享 MySQL 模式关闭）
#   with-graph  — Neo4j 图谱（可选，共享模式可仅启应用）

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: ai-medical-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ai-medical-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    profiles: ["with-mysql"]
    image: mysql:8.0
    container_name: ai-medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: db_ai_medical
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-128M}
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=50
      - --skip-mysqlx
    ports:
      - "${MYSQL_PUBLISH:-${MYSQL_PORT:-3308}:3306}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/db_ai_medical.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    mem_limit: ${MYSQL_MEM_LIMIT:-4g}
    memswap_limit: ${MYSQL_MEMSWAP_LIMIT:-4g}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  neo4j:
    profiles: ["with-graph"]
    image: neo4j:5-community
    container_name: ai-medical-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请设置 NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-128m}
      NEO4J_server_jvm_additional: ${NEO4J_JVM_ADDITIONAL:-}
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_HTTP_PUBLISH:-${NEO4J_HTTP_PORT:-7474}:7474}"
      - "${NEO4J_BOLT_PUBLISH:-${NEO4J_BOLT_PORT:-7687}:7687}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: ${NEO4J_MEM_LIMIT:-2g}
    memswap_limit: ${NEO4J_MEMSWAP_LIMIT:-2g}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: ${NEO4J_HEALTH_RETRIES:-20}
      start_period: ${NEO4J_HEALTH_START:-40s}

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-medical-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_PASSWORD 或 MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: db_ai_medical
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?请设置 NEO4J_PASSWORD}
      NEO4J_REQUIRED: ${NEO4J_REQUIRED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_REASONING: ${LLM_REASONING:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-0}
      UPLOAD_DIR: /data/uploads
      CHROMA_PERSIST_DIR: /data/chroma_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://localhost:5174}
      WECHAT_MINI_APPID: ${WECHAT_MINI_APPID:-}
      WECHAT_MINI_SECRET: ${WECHAT_MINI_SECRET:-}
      WECHAT_DEV_LOGIN: ${WECHAT_DEV_LOGIN:-false}
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      QDRANT_URL: http://qdrant:6333
      AI_SERVICE_URL: http://ai-service:8010
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME:-admin}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      INIT_GRAPH: ${INIT_GRAPH:-true}
      INIT_KNOWLEDGE: ${INIT_KNOWLEDGE:-false}
      ANONYMIZED_TELEMETRY: "False"
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PUBLISH:-${BACKEND_PORT:-8000}:8000}"
    volumes:
      - uploads_data:/data/uploads
      - chroma_data:/data/chroma_db
      - ./server/scripts/docker_entrypoint.py:/app/scripts/docker_entrypoint.py:ro
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-2g}
    logging: *default-logging
    networks:
      - default
      - shared-infra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: ${BACKEND_HEALTH_RETRIES:-20}
      start_period: ${BACKEND_HEALTH_START:-240s}

  vector-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-medical-vector-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_PASSWORD 或 MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: db_ai_medical
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      UPLOAD_DIR: /data/uploads
      CHROMA_PERSIST_DIR: /data/chroma_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
      NEO4J_REQUIRED: "false"
    command: ["python", "scripts/vector_worker.py"]
    volumes:
      - uploads_data:/data/uploads
      - chroma_data:/data/chroma_db
      - ./server/scripts/vector_worker.py:/app/scripts/vector_worker.py:ro
    mem_limit: ${VECTOR_WORKER_MEM_LIMIT:-1g}
    logging: *default-logging
    networks:
      - default
      - shared-infra

  ai-service:
    build: ./server
    container_name: ai-medical-ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: sqlite:////tmp/ai-service.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
      NEO4J_REQUIRED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
    command: ["uvicorn", "services.ai_app:app", "--host", "0.0.0.0", "--port", "8010"]
    mem_limit: ${AI_SERVICE_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  scheduler-worker:
    build: ./server
    container_name: ai-medical-scheduler-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_PASSWORD 或 MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: db_ai_medical
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY}
      NEO4J_REQUIRED: "false"
    command: ["python", "scripts/scheduler_worker.py"]
    mem_limit: ${SCHEDULER_WORKER_MEM_LIMIT:-256m}
    logging: *default-logging
    networks:
      - default
      - shared-infra

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    logging: *default-logging

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
        NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
    container_name: ai-medical-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    memswap_limit: ${FRONTEND_MEMSWAP_LIMIT:-512m}
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  shared-infra:
    name: shared-infra
    external: ${SHARED_INFRA_EXTERNAL:-false}

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:
  uploads_data:
  chroma_data:
  redis_data:
  qdrant_data:
  prometheus_data:
